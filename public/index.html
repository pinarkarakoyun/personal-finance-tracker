<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Personal Finance Tracker</h1>

    <section id="auth-section">
      <form id="login-form">
        <h2>Giriş yap</h2>
        <input type="email" id="login-email" placeholder="E-posta" required>
        <input type="password" id="login-password" placeholder="Şifre" required>
        <button type="submit">Giriş</button>
      </form>

      <form id="register-form">
        <h2>Kayıt ol</h2>
        <input type="text" id="register-name" placeholder="Ad Soyad" required>
        <input type="email" id="register-email" placeholder="E-posta" required>
        <input type="password" id="register-password" placeholder="Şifre (en az 8 karakter)" minlength="8" required>
        <button type="submit">Kayıt ol</button>
      </form>

      <p id="auth-message"></p>
    </section>

    <section id="app-section" hidden>
      <div class="topbar">
        <p>Hoş geldin, <strong id="user-name"></strong></p>
        <button id="logout-button" type="button">Çıkış</button>
      </div>

      <p id="app-message" class="error"></p>
        <div id="summary">
            <div class="summary-header">
                <h2>Aylık özet</h2>
                <input type="month" id="summary-month" required>
            </div>
            <div class="cards">
                <div class="card"><small>Gelir</small><strong id="sum-income" class="income">-</strong></div>
                <div class="card"><small>Gider</small><strong id="sum-expense" class="expense">-</strong></div>
                <div class="card"><small>Kalan</small><strong id="sum-balance">-</strong></div>
            </div>
            <div id="chart-box" class="chart-box"><canvas id="expense-chart"></canvas></div>
            <p id="chart-empty" hidden>Bu ay için gider kaydı yok.</p>
        </div>

      <form id="category-form">
        <h2>Kategori ekle</h2>
        <input type="text" id="category-name" placeholder="Kategori adı (örn. Market)" maxlength="50" required>
        <select id="category-type" required>
          <option value="Expense">Gider</option>
          <option value="Income">Gelir</option>
        </select>
        <button type="submit">Kategori ekle</button>
      </form>

    <form id="transaction-form">
        <h2 id="transaction-form-title">İşlem ekle</h2>
        <select id="transaction-category" required></select>
        <input type="number" id="transaction-amount" placeholder="Tutar" min="0.01" step="0.01" required>
        <input type="text" id="transaction-description" placeholder="Açıklama (isteğe bağlı)" maxlength="255">
        <input type="date" id="transaction-date" required>
        <button type="submit" id="transaction-submit">İşlem ekle</button>
        <button type="button" id="transaction-cancel" class="secondary" hidden>Vazgeç</button>
    </form>

      <h2>İşlemler</h2>

      <div id="filters">
        <input type="search" id="filter-q" placeholder="Ara (açıklama veya kategori)">
        <select id="filter-type">
          <option value="">Tümü</option>
          <option value="Income">Gelir</option>
          <option value="Expense">Gider</option>
        </select>
        <select id="filter-category">
          <option value="">Tüm kategoriler</option>
        </select>
        <input type="month" id="filter-month" title="Ay">
        <button type="button" id="filter-clear" class="secondary">Temizle</button>
      </div>

      <ul id="transaction-list"></ul>

      <div id="pagination" hidden>
        <button type="button" id="page-prev" class="secondary">Önceki</button>
        <span id="page-info"></span>
        <button type="button" id="page-next" class="secondary">Sonraki</button>
      </div>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
<script src="app.js"></script>

  <script src="app.js"></script>
</body>
</html>
